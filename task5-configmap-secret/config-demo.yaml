apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-demo
  template:
    metadata:
      labels:
        app: config-demo
    spec:
      containers:
        - name: demo
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"ENV color=$APP_COLOR user=$DB_USER | FILE color=$(cat /etc/config/APP_COLOR)\"; sleep 10; done"]
          env:
            - name: APP_COLOR
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_COLOR
          envFrom:
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: config-vol
              mountPath: /etc/config
            - name: secret-vol
              mountPath: /etc/secret
              readOnly: true
      volumes:
        - name: config-vol
          configMap:
            name: app-config
        - name: secret-vol
          secret:
            secretName: app-secret
